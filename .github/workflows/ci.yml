name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Build | Sideload | Store'
        default: Build

jobs:
  core:
    name: Core + Tests (Linux)
    runs-on: [self-hosted, Linux, rog]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build RoG.sln -c Release
      - run: dotnet test RoG.sln -c Release --no-build

  windows:
    name: WinUI-App (Windows)
    runs-on: [self-hosted, Windows]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build, Tests, MSIX
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Mode '${{ github.event.inputs.mode || 'Build' }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-artifacts
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14
