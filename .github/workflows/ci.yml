name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Build | Sideload | Store'
        type: choice
        options: [Build, Sideload, Store]
        default: Build

# Standard: nur lesen; der Windows-Job fordert contents: write für das Entwurfs-Release selbst an
permissions:
  contents: read

jobs:
  core:
    name: Core + Tests (Linux)
    # Öffentliches Repo: GitHub-Runner statt eigener – Pull-Requests aus Forks laufen nie auf unseren Maschinen
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - run: dotnet build RoG.sln -c Release
      - run: dotnet test RoG.sln -c Release --no-build --blame-hang-timeout 5m --blame-hang-dump-type none
      # App-C# und x:Bind-Pfade schon hier prüfen (Fehler nach ~1 min statt nach dem Windows-Build)
      - name: App prüfen (C# + x:Bind + Barrierefreiheit)
        run: |
          dotnet build tools/AppCompileCheck/AppCompileCheck.csproj -c Release -nologo
          python3 -I scripts/check-xaml-bindings.py
          python3 -I scripts/check-a11y.py

  windows:
    name: WinUI-App (Windows)
    # Eigener Windows-Runner (Signatur, Store-Paket): nie für Pull-Requests (auch nicht aus dem eigenen Repo) – fremder
    # Code liefe sonst auf rog-win-1. Nur push und workflow_dispatch; Pull-Requests bekommen den Core-Job oben.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Windows]
    timeout-minutes: 90
    permissions:
      contents: write
    # Keine weiterlaufenden MSBuild-Knoten/Compiler-Server: sie halten sonst die Ausgabe-Pipe offen und der Schritt
    # hängt nach erfolgreichem Build (beobachtet 16.10.2026 nach „App bauen (x64)“).
    env:
      MSBUILDDISABLENODEREUSE: '1'
      DOTNET_CLI_USE_MSBUILD_SERVER: '0'
      UseSharedCompilation: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # kein Token im .git/config des eigenen Runners
          persist-credentials: false
      - name: Werkzeuge prüfen
        shell: powershell
        run: |
          $missing = @()
          foreach ($tool in 'git', 'dotnet') { if (-not (Get-Command $tool -ErrorAction SilentlyContinue)) { $missing += $tool } }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) { & $vswhere -all -prerelease -products * -version '[18.0,19.0)' -format text | Select-String 'displayName|isComplete|isLaunchable|installationPath'; if (-not (& $vswhere -all -prerelease -latest -products * -version '[18.0,19.0)' -requires Microsoft.Component.MSBuild -property installationPath)) { $missing += 'Visual Studio/Build Tools 2026' } } else { $missing += 'Visual Studio / Build Tools' }
          if (Get-Command dotnet -ErrorAction SilentlyContinue) { dotnet --list-sdks }
          if ($missing.Count -gt 0) { Write-Error ("Auf dem Runner fehlt: " + ($missing -join ', ') + " - siehe docs/BUILD-VM.md Abschnitt 3"); exit 1 }
      - name: Build, Tests, MSIX
        shell: powershell
        # Eingaben nur über env: – keine Ausdrücke direkt im Skript
        env:
          MODE: ${{ inputs.mode || 'Build' }}
        run: |
          $pwsh = Join-Path $env:ProgramFiles 'PowerShell\7\pwsh.exe'
          $mode = $env:MODE
          if ($mode -notin 'Build', 'Sideload', 'Store') { Write-Error "Unbekannter Modus: $mode"; exit 1 }
          if (Test-Path $pwsh) { & $pwsh -NoProfile -File ./scripts/build-windows.ps1 -Mode $mode } else { ./scripts/build-windows.ps1 -Mode $mode }
          exit $LASTEXITCODE
      # Pakete zusätzlich als Entwurfs-Release (nur für Repo-Mitglieder sichtbar): zählt nicht zum Artefakt-Kontingent
      - name: Pakete als Entwurfs-Release ablegen
        if: success() && (inputs.mode == 'Store' || inputs.mode == 'Sideload')
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: ${{ inputs.mode }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $mode = $env:MODE
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.RoGVersion | Where-Object { $_ } | Select-Object -First 1
          # Store: nur die .msixupload fürs Partner Center; Sideload: Bundle + Zertifikat (Uplink des Runners ist langsam)
          $include = if ($mode -eq 'Store') { @('*.msixupload') } else { @('*.msixbundle', '*.cer') }
          $files = @(Get-ChildItem artifacts/msix -Recurse -Include $include | Where-Object { $_.FullName -notmatch '\\Dependencies\\' })
          if ($files.Count -eq 0) { Write-Error 'Keine Pakete gefunden'; exit 1 }
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
          $api = "https://api.github.com/repos/$env:REPO"
          $body = @{ tag_name = "$($mode.ToLower())-$version-run$env:RUN_ID"; target_commitish = $env:SHA; name = "$mode $version (Lauf $env:RUN_ID)"; draft = $true; body = "Paket aus CI-Lauf $env:RUN_ID, Commit $env:SHA." } | ConvertTo-Json
          $release = Invoke-RestMethod -Method Post -Uri "$api/releases" -Headers $headers -Body $body -ContentType 'application/json'
          foreach ($f in $files) {
            $uri = ($release.upload_url -replace '\{.*\}', '') + '?name=' + [uri]::EscapeDataString($f.Name)
            # curl.exe statt Invoke-RestMethod: streamt die Datei, Windows PowerShell bricht bei großen Uploads ab
            curl.exe --fail-with-body --silent --show-error --retry 3 --retry-all-errors --max-time 3600 -X POST `
              -H "Authorization: Bearer $env:GH_TOKEN" -H 'Content-Type: application/octet-stream' --data-binary "@$($f.FullName)" $uri -o NUL
            if ($LASTEXITCODE -ne 0) { Write-Error "Upload fehlgeschlagen: $($f.Name)"; exit 1 }
            Write-Host "hochgeladen: $($f.Name) ($([math]::Round($f.Length / 1MB)) MB)"
          }
          Write-Host "Entwurfs-Release: $($release.html_url)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        # Kontingent voll darf den Lauf nicht rot machen, wenn das Paket schon im Release liegt
        continue-on-error: true
        with:
          name: windows-artifacts
          path: artifacts/
          if-no-files-found: ignore
          # Artefakt-Speicher der Organisation ist knapp (Kontingent war am 22.10.2026 voll): Pakete 3 Tage, reine Build-Protokolle 1 Tag
          retention-days: ${{ (inputs.mode == 'Store' || inputs.mode == 'Sideload') && 3 || 1 }}
