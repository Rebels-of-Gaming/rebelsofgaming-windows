name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Build | Sideload | Store'
        default: Build

jobs:
  core:
    name: Core + Tests (Linux)
    runs-on: [self-hosted, Linux, rog]
    timeout-minutes: 30
    env:
      # Eigene Runner ohne root: .NET ins Benutzerverzeichnis statt /usr/share/dotnet
      DOTNET_INSTALL_DIR: ${{ github.workspace }}/../.dotnet
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build RoG.sln -c Release
      - run: dotnet test RoG.sln -c Release --no-build

  windows:
    name: WinUI-App (Windows)
    runs-on: [self-hosted, Windows]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Werkzeuge prüfen
        shell: powershell
        run: |
          $missing = @()
          foreach ($tool in 'pwsh', 'git', 'dotnet') { if (-not (Get-Command $tool -ErrorAction SilentlyContinue)) { $missing += $tool } }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) { & $vswhere -latest -products * -property displayName } else { $missing += 'Visual Studio / Build Tools' }
          if (Get-Command dotnet -ErrorAction SilentlyContinue) { dotnet --list-sdks }
          if ($missing.Count -gt 0) { Write-Error ("Auf dem Runner fehlt: " + ($missing -join ', ') + " - siehe docs/BUILD-VM.md Abschnitt 3"); exit 1 }
      - name: Build, Tests, MSIX
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Mode '${{ github.event.inputs.mode || 'Build' }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-artifacts
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14
